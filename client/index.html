<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SentinalOne Firewall Rule Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: "#F98105",
                "ait-orange": "#F98105",
                "ait-orange-dark": "#E07304",
              },
              "light-bg": "#F4F4F3",
              "light-card": "#FFFFFF",
              "light-text": "#1F2937",
              "light-subtext": "#4B5563",
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    class="bg-light-bg text-light-text h-screen w-screen flex items-center justify-center p-4"
  >
    <!-- Card -->
    <div
      class="mx-auto bg-light-card rounded-2xl shadow-2xl p-6 md:p-8 flex flex-col h-full md:h-auto max-h-[95vh]"
    >
      <!-- Header -->
      <div class="flex-shrink-0 mb-6 text-center">
        <h1 class="text-3xl font-bold text-primary-ait-orange">
          SentinalOne Firewall Rule Manager
        </h1>
        <p class="text-light-subtext mt-2">
          Add IPs/CIDRs, then save the JSON file.
        </p>
      </div>

      <!-- Main Content -->
      <div class="flex-grow flex flex-col md:flex-row gap-6 min-h-0">
        <!-- Left Panel: IP/Cidr Input -->
        <div class="md:w-1/3 flex flex-col">
          <label for="ip-input" class="text-lg font-semibold mb-2"
            >IPs & CIDR Ranges</label
          >
          <p class="text-sm text-light-subtext mb-2">
            Enter one per line. Duplicates will be ignored. Will not check for valid IPs or CIDR ranges.
          </p>
          <textarea
            id="ip-input"
            placeholder="e.g., 192.168.1.1&#10;62.224.0.0/16"
            class="flex-grow bg-white border border-gray-300 rounded-lg p-3 text-gray-900 focus:outline-none focus:ring-2 focus:ring-primary-ait-orange resize-none"
          ></textarea>
          <!-- Left Panel: Action Buttons -->
          <div class="flex gap-4 mt-4">
            <button
              id="add-ip-button"
              class="w-full bg-primary-ait-orange hover:bg-primary-ait-orange-dark text-white font-bold py-2 px-4 rounded-lg transition duration-300 shadow-lg"
            >
              Add to Rules &rarr;
            </button>
            <button
              id="clear-ip-button"
              class="w-1/3 bg-gray-200 hover:bg-gray-300 text-light-text font-bold py-2 px-4 rounded-lg transition duration-300"
            >
              Clear
            </button>
          </div>
        </div>

        <!-- Right Panel: JSON Output -->
        <div class="md:w-2/3 flex flex-col">
          <label for="json-output" class="text-lg font-semibold mb-2"
            >Firewall Rule JSON</label
          >
          <p class="text-sm text-light-subtext mb-2">
            The final JSON can be edited here before saving.
          </p>
          <textarea
            id="json-output"
            class="flex-grow bg-white border border-gray-300 rounded-lg p-3 font-mono text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-primary-ait-orange resize-none"
          ></textarea>
        </div>
      </div>

      <!-- Footer: Action Buttons -->
      <div
        class="flex-shrink-0 flex flex-col sm:flex-row items-center justify-between gap-4 mt-6"
      >
        <div class="flex gap-4">
          <button
            id="load-file-button"
            class="bg-gray-200 hover:bg-gray-300 text-light-text font-bold py-2 px-4 rounded-lg transition duration-300"
          >
            Load from File
          </button>
        </div>
        <!-- Status Message Area -->
        <div
          id="status-message"
          class="h-6 text-center text-green-ait-orange-dark transition-opacity duration-300"
        ></div>

        <button
          id="download-button"
          class="bg-gray-200 hover:bg-gray-300 text-light-text font-bold py-2 px-4 rounded-lg transition duration-300"
        >
          Download JSON File
        </button>
      </div>
    </div>
    <script src="./renderer.js" defer></script>
  </body>
</html>
